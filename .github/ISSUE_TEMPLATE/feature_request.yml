name: Feature request
description: Suggest an improvement to StrucDNA.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include alternatives and relevant examples, if useful.
    validations:
      required: true

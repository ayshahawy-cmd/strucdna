name: Bug report
description: Report a reproducible problem in StrucDNA.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page or feature involved. Remove API keys and personal data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, Node version, and commit or version
    validations:
      required: true
